name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Bespoke jobs: shell checks and macOS bootstrap smoke test.
  # No ci-workflows equivalent exists for these.
  # ---------------------------------------------------------------------------
  shell_lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@b4ffde65f46336488b8621a4f500c1c0b6c0f1df # v4.1.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck bootstrap scripts
        run: |
          find scripts -type f -name "*.sh" -print0 | xargs -0 -n1 shellcheck -x -e SC1090,SC1091,SC2034,SC2086
          shellcheck -x -e SC1090,SC1091,SC2034,SC2086 install-macos.sh

  shell_syntax:
    name: Shell Syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@b4ffde65f46336488b8621a4f500c1c0b6c0f1df # v4.1.1
        with:
          persist-credentials: false

      - name: Bash syntax check
        run: |
          find scripts -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
          bash -n install-macos.sh

  bootstrap_smoke:
    name: Bootstrap Smoke
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@b4ffde65f46336488b8621a4f500c1c0b6c0f1df # v4.1.1
        with:
          persist-credentials: false

      - name: Entrypoint help
        run: |
          ./install-macos.sh --help
          ./scripts/bootstrap/bootstrap.sh --help
          ./scripts/bootstrap/setup-macos-dev-stack.sh --help

      - name: Linux placeholder execution
        run: ./scripts/bootstrap/bootstrap.sh --os linux --skip-health-check

  # ---------------------------------------------------------------------------
  # Reusable workflow calls (pinned to ci-workflows SHA).
  # ---------------------------------------------------------------------------
  docs-quality:
    name: docs-quality
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/docs-quality.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15

  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/actionlint.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15

  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/secret-scan.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15

  zizmor:
    name: zizmor (SARIF)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/zizmor-sarif.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15

  dependency-review:
    name: dependency-review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-dependency-review.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15
